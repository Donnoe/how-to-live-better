返利、免费体检、赠送礼品、会议营销、养生讲座、专家义诊。第五种，以享受「旅居养老」为名：低价或免费旅游、储值返利、积分养老。钱追不回来，条例里写明了。防范和处置非法集资条例第二十五条规定，「因参与非法集资受到的损失，由集资参与人自行承担」，亏掉的钱只能自己认。官方通报过的案子里，戴某平等人以预定养老公寓床位名义非法集资 1.36 亿元，被害人 2100 余人，戴某平以集资诈骗罪判 15 年，并处罚金 40 万元。曹某铭以投资养老产业为名集资诈骗 132.07 亿元，涉及 11 万余人，判无期徒刑、剥夺政治权利终身、没收个人全部财产。保健品会销走的是诈骗罪。倪某荣用免费宴请、赠送礼品、专车接送，把老年人拉去听课。讲师用「虚假人设、虚假案例、虚高砍价」编造防癌抗癌功效。老人被诱骗以成本价的数十倍买「二氢槲皮素」。销售金额 62 万余元。倪某荣判 10 年 3 个月，并处罚金 12 万元（全国，条例 2021 年 5 月 1 日起施行）","e":"A","src":"民政部 (2023). 关于养老服务领域非法集资的风险提示. <https://www.gov.cn/lianbo/bumen/202306/content_6886556.htm>（中国政府网发布）；民政部、中国银保监会 (2021). 关于养老领域非法集资的风险提示. <https://www.mca.gov.cn/n152/n164/c36171/content.html>；国务院 (2021). 防范和处置非法集资条例（国务院令第 737 号，第二、二十五、三十条）. <https://www.gov.cn/zhengce/zhengceku/2021-02/10/content_5586632.htm>；最高人民检察院 (2022). 检察机关打击整治养老诈骗犯罪典型案例. <https://www.spp.gov.cn/xwfbh/wsfbt/202206/t20220617_560010.shtml>；最高人民法院 (2025). 依法惩治涉民生领域诈骗犯罪典型案例（案例五 倪某荣诈骗案）. <https://www.court.gov.cn/zixun/xiangqing/482861.html>","r":"判断不靠「这家看着正规」，靠「有没有让你先交钱、有没有承诺回报」。养老机构本来是卖服务的，话里一带上投资、返利、回本，就别信。老人被拉去听课、旅游、义诊，本身不违法，也很难拦住。能拦的是掏钱那一步，配合第 3 条的双人确认规矩用。已经交了钱，就立刻按第 8 节第 2 条打 110 或 96110 要求止付，同时向当地负责处置非法集资的牵头部门举报。以房养老是另一套路径，见第 6 条（住房反向抵押养老保险）。","g":"钱=0 时间=少 毅力=些 收益=大 口径=金钱","d":"parent"},{"k":"10-11","s":10,"st":"10. 恋爱和结婚划不划算","n":11,"t":"父母出资买房，在转账的时候就把是借是送写清楚","p":"婚前父母出钱买房，默认只给自己孩子。婚后出的钱没约定，按夫妻共同财产算。2025 年 2 月起，婚后一方父母全额出资、又没写明只给自己孩子的，离婚时法院可以把房判给出资方的孩子，再定补不补偿另一方。要算借款，就当天写清楚、双方签字。","c":"不花钱。出资当天写一页说明，写明这笔钱是赠与谁、还是借给谁，出资的父母和子女都签字。如果写的是借款，就让夫妻两个人都签，转账备注也写同一句话。","b":"婚前父母为双方购房出资的，认定为对自己子女个人的赠与。父母明确表示赠与双方的除外。婚后出资的，有约定按约定。没有约定或者约定不明确的，按夫妻共同财产的原则处理。2025 年 2 月 1 日起还有一条。婚内由一方父母全额出资、赠与合同又没写明只赠与自己子女的，离婚分割时，法院可以判房屋归出资人子女一方所有。判归之后再综合几项情况，确定要不要给另一方补偿、补多少。这几项是共同生活和生育共同子女的情况、离婚过错、对家庭的贡献大小、离婚时房屋市场价格。一方父母部分出资，或者双方父母都出资的，以出资来源和比例为基础判归其中一方，并合理补偿（全国）","e":"A","src":"最高人民法院 (2020). 关于适用《民法典》婚姻家庭编的解释（一）（法释〔2020〕22 号，第二十九条）. <https://www.court.gov.cn/fabu/xiangqing/282071.html>；最高人民法院 (2025). 关于适用《民法典》婚姻家庭编的解释（二）（法释〔2025〕1 号，第八条）. <https://www.court.gov.cn/zixun/xiangqing/452771.html>；全国人大 (2020). 民法典（第一千零六十二条第一款第四项）. <https://www.spp.gov.cn/spp/fl/202006/t20200602_463888.shtml>","r":"写清楚对两边都有用。出钱的父母不必再指望离婚时补一张借条来保住出资。解释（二）施行后，钱是谁出的本身就是分房子的依据，房本写谁的名字不再决定归属。接受出资的一方，也不用等到离婚才知道这笔钱算什么。要按借款办就真按借款办：双方说好是借，约定怎么还，转账写明，必要时留下还款记录。缺一样，上了法庭都要解释","g":"钱=0 时间=少 毅力=否 收益=大 口径=金钱","d":"rel"},{"k":"8-24","s":8,"st":"8. 别把自己搭进去：法律与财产安全","n":24,"t":"彩礼走转账并备注，聊天记录留好；借婚姻要钱可以要回","p":"借婚姻索取财物是法律禁止的，法院支持返还。没登记的、登记了但确实没共同生活的、婚前给了彩礼导致给钱一方生活困难的，可以要求返还。已登记又共同生活的一般不返还。所以彩礼、三金、改口费都走转账并备注用途，谁给的钱谁留证据，男女一样。","c":"不花钱。彩礼、三金、改口费都走转账，并在备注里写清用途。口头说好的事，用聊天记录留痕，或者让家人在场确认。","b":"法律禁止借婚姻索取财物。一方以彩礼为名借婚姻索取财物的，另一方要求返还，法院支持。有三种情形可以要求返还：没办结婚登记；办了登记但确实没有共同生活；婚前给了彩礼，给到出钱那一方生活困难。已经登记并且共同生活的，一般不返还。但共同生活的时间短、彩礼数额又过高的，法院会按钱实际怎么花的、有没有嫁妆、有没有孕育、双方有没有过错，来确定返还的比例。没登记但已经同居的，同样按比例处理（全国，2024 年 2 月起）","e":"A","src":"全国人大 (2020). 民法典（第一千零四十二条）. <https://www.spp.gov.cn/spp/fl/202006/t20200602_463888.shtml>；最高人民法院 (2024). 关于审理涉彩礼纠纷案件适用法律若干问题的规定（法释〔2024〕1 号，第二、五、六条）. <https://www.court.gov.cn/fabu/xiangqing/423442.html>；最高人民法院 (2020). 关于适用《民法典》婚姻家庭编的解释（一）（法释〔2020〕22 号，第五条）. <https://www.court.gov.cn/fabu/xiangqing/282071.html>","r":"彩礼算不算「数额过高」，要看给钱一方所在地的人均可支配收入和他家的情况，全国没有统一数字。该退多少，由法官一个案子一个案子地定。给钱的一方和收钱的一方规则一样，谁给的钱谁留证据。","g":"钱=0 时间=少 毅力=否 收益=大 口径=金钱","d":"rel"},{"k":"10-18","s":10,"st":"10. 恋爱和结婚划不划算","n":18,"t":"同性伴侣趁两个人都清醒，办好授权委托、意定监护和遗嘱：法律上你们不是近亲属，不办就没有签字权和继承权","p":"法律上的近亲属是配偶、父母、子女、兄弟姐妹这些人，伴侣不算。不提前办文件，一方病重时，另一方替他做不了主。一方去世时，另一方一分遗产也继承不到。三份文件各管一段：活着时靠授权委托，失去判断能力后靠意定监护，身后靠遗嘱。","c":"意定监护和遗嘱去公证处办，公证费各地不同，几百元起。自己手写遗嘱不花钱。前后要花一两个半天。难在两个人要坐下来谈生病和死。","b":"民法典第一千零四十五条列的近亲属是配偶、父母、子女、兄弟姐妹、祖父母、外祖父母、孙子女、外孙子女。第一千一百二十七条的法定继承人先是配偶、子女、父母，其次是兄弟姐妹、祖父母、外祖父母。伴侣两处都不在。第一千二百一十九条管的是手术、特殊检查、特殊治疗。不能或者不宜向患者说明的，医务人员要向患者的「近亲属」说明，并取得同意。有三条路可以补上。第一，第三十三条允许成年人和「其他愿意担任监护人的个人」事先书面约定监护人。本人丧失或者部分丧失民事行为能力后，这个人来当监护人，监护人就是法定代理人。第二，第一百六十五条规定，书面授权委托书要写明代理人的姓名、代理事项、权限和期限，由本人签名或者盖章。本人一去世，委托就终止。第三，第一千一百三十三条允许立遗嘱，把个人财产赠给法定继承人以外的个人。湖北省司法厅网站刊登的宜昌市司法局文章写明，同性伴侣可以办意定监护协议公证，指定对方当自己将来的监护人（全国）","e":"A","src":"全国人大 (2020). 民法典（第二十三、三十三、一百六十五、一百七十三、一千零四十五、一千一百二十四、一千一百二十七、一千一百三十三至一千一百四十、一千一百四十二、一千二百一十九条）. <https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf>（国家法律法规数据库）；宜昌市司法局 (2021). 意定监护公证：通向彩虹的公证之路. 湖北省司法厅网站「实践荟萃」栏目. <https://sft.hubei.gov.cn/fbjd/sjhc/202101/t20210108_3208602.shtml>","r":"伴侣拿遗产的身份是「受遗赠人」，不是继承人。知道有这份遗赠后，60 天内要明确表示接受，不表示就算放弃。伴侣本人和跟他有利害关系的人，不能当遗嘱见证人。立了几份遗嘱，以最后一份为准，见第 17 节第 2 条（遗嘱后立的推翻先立的）。意定监护人能不能直接签手术同意书，各医院做法不一，提前问一下常去的医院。家属不认这些文件，就要打官司：一审普通程序 6 个月起，律师费自己出。所以文件尽量去公证处办。一起买的房子、一起存的钱，按真实出资另外写书面约定。意定监护怎么办，见第 17 节第 1 条（书面指定将来的监护人）。受益人是你自己和伴侣。","g":"钱=少 时间=中 毅力=些 收益=大 口径=自由","d":"rel"},{"k":"32-1","s":32,"st":"32. 出国留学：身份、打工、保险和回国认证","n":1,"t":"交学费之前先查学校在不在留服中心的认证院校名单里","p":"回国以后，这张文凭要用来考公、进国企、落户、评职称，就得先过一道认证。认证由教育部留学服务中心做。学校不在能认证的名单里，学费和时间就白花了，文凭在国内用不上。查名单不花钱，查完再交学费。","c":"不花钱。在留服中心的「认证院校查询」里输一次学校名，几分钟就查完","b":"中国（教育部）留学服务中心有一个认证院校查询入口。你可以按国家查，也可以按学校名字查。查的是这所学校发的学历学位在不在认证范围里。另外，教育部教育涉外监管信息网还公布中外合作办学和境外办学的监管信息","e":"A","src":"中国（教育部）留学服务中心. 认证院校查询. <http://yxcx.cscse.edu.cn/>；教育部教育涉外监管信息网. <https://jsj.moe.gov.cn/>","r":"中介嘴上说「教育部认可」不算数，以你自己上网查到的结果为准。名单会变，入学时在名单里，毕业时不一定还在，所以读书期间每年复查一次。中外合作办学的项目另有一套认证注册的制度。2008 年以后入学的，可以凭姓名和身份证号，在涉外监管信息网查自己的注册序号。","g":"钱=0 时间=少 毅力=否 收益=大 口径=金钱","d":"rel"},{"k":"33-2","s":33,"st":"33. 残疾之后怎么活","n":2,"t":"致残之后的头十年是自杀的高风险期，别当成「想开点」就行的事","p":"刚残疾那几年，自己或者家人情绪垮掉，是常见的，不是意志力的问题。英国两家脊髓损伤中心的长期随访发现，这群人的自杀率是普通人的五倍。九成以上的自杀发生在受伤后的头十年。受伤原因本身就是自杀的人，风险还要高出一截。","c":"不花钱。打一个电话，或者挂一次号。","b":"研究跟踪了 1991 到 2010 年新入院、熬过伤后第一年、出院时有神经功能缺损的 2304 例外伤性脊髓损伤患者，随访到 2014 年底。其中 63 例（2.7%）的受伤原因本身就是自杀未遂。到随访结束共 533 人死亡，其中 4.2% 死于自杀，91% 的自杀发生在受伤后的头十年。按年龄标化的自杀死亡率是每年每 10 万人 62.5 例（95% CI 36.4–88.6，可信范围），是 2014 年英格兰和威尔士普通人群自杀率（每 10 万人 12.2 例）的五倍。因自杀未遂致伤的那部分人，和其他致伤原因相比，死亡的比值比是 4.32（P<0.001），自杀的比值比是 9.46（P<0.001）","e":"A","src":"Savic G, DeVivo MJ, Frankel HL, Jamous MA, Soni BM, Charlifue S (2018). Suicide and traumatic spinal cord injury - a cohort study. Spinal Cord, 56(1):2-6. <https://doi.org/10.1038/sc.2017.98>","r":"这项研究只看了脊髓损伤，套到失明、截肢、烧伤这些别的致残原因上属于往外推。它能说明的是时间窗：风险不是出院就过去了，要盯十年。要人陪着说话打 12356，见第 29 节第 11 条（12356）。家里别囤安眠药和农药，见第 1 节第 25 条（自杀念头）。哀伤和情绪卡住半年还在原地，去精神科或临床心理科挂号，见第 29 节第 8 条（哀伤过了半年）。","g":"钱=0 时间=少 毅力=些 收益=大 口径=死亡率","d":"rel"}],"secs":[{"s":1,"t":"1. 不要早死","d":"safety","n":41},{"s":2,"t":"2. 不要慢慢死","d":"health","n":42},{"s":3,"t":"3. 不要浪费精力","d":"mind","n":24},{"s":4,"t":"4. 不要浪费时间","d":"mind","n":18},{"s":5,"t":"5. 不要浪费钱","d":"money","n":44},{"s":6,"t":"6. 反面清单","d":"health","n":28},{"s":7,"t":"7. 没钱的时候怎么活","d":"money","n":22},{"s":8,"t":"8. 别把自己搭进去：法律与财产安全","d":"law","n":45},{"s":9,"t":"9. 普通人容易踩的法律红线","d":"law","n":25},{"s":10,"t":"10. 恋爱和结婚划不划算","d":"rel","n":20},{"s":11,"t":"11. 程序员和技术人容易踩的红线","d":"work","n":17},{"s":12,"t":"12. 创业与做生意：别把家底赔进去","d":"law","n":24},{"s":13,"t":"13. 紧急情况：先做什么","d":"safety","n":44},{"s":14,"t":"14. 账号与信息安全","d":"work","n":9},{"s":15,"t":"15. 租房与买房","d":"money","n":9},{"s":16,"t":"16. 得了慢性病之后怎么活","d":"health","n":9},{"s":17,"t":"17. 家里有老人","d":"parent","n":9},{"s":18,"t":"18. 养孩子划不划算","d":"parent","n":6},{"s":19,"t":"19. 在职、离职和工伤","d":"work","n":18},{"s":20,"t":"20. 刚出生的孩子怎么带","d":"parent","n":13},{"s":21,"t":"21. 出国、旅行与境外安全","d":"safety","n":11},{"s":22,"t":"22. 怎么放松：娱乐场所和减压","d":"mind","n":10},{"s":23,"t":"23. 学什么技能划算","d":"work","n":23},{"s":24,"t":"24. 看病：怎么少花钱少走弯路","d":"health","n":11},{"s":25,"t":"25. 人走了以后要办什么","d":"law","n":10},{"s":26,"t":"26. 做一个网站或平台：资质、备案和服务器","d":"work","n":11},{"s":27,"t":"27. 怀孕和生产：从发现怀孕到出院办证","d":"parent","n":16},{"s":28,"t":"28. 别为了外形把身体搞坏","d":"health","n":8},{"s":29,"t":"29. 遭遇重大打击之后","d":"mind","n":13},{"s":30,"t":"30. 上学以后的孩子","d":"parent","n":17},{"s":31,"t":"31. 十八岁之后有哪几条路","d":"parent","n":16},{"s":32,"t":"32. 出国留学：身份、打工、保险和回国认证","d":"rel","n":10},{"s":33,"t":"33. 残疾之后怎么活","d":"rel","n":20},{"s":34,"t":"34. 家里的常备药别吃出事","d":"health","n":11}],"total_items":654,"total_secs":34};

/* ---- 确定性 PRNG：mulberry32，种子由字符串派生 ---- */
function fnv1a(str){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
/* 每天固定十条：先把 61 条池按 8 个生活领域分组，各组洗牌，再按领域轮转取满 10 条
   ——保证一天里看到的是八个领域，而不是十条同领域；同一种子必得同一批。 */
function pickTen(seedStr){
  const rnd = mulberry32(fnv1a(seedStr));
  const groups = {};
  DB.items.forEach(it => (groups[it.d] = groups[it.d] || []).push(it));
  const keys = Object.keys(groups);
  keys.forEach(k => {
    const g = groups[k];
    for (let i = g.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i+1)); [g[i], g[j]] = [g[j], g[i]]; }
  });
  const order = Object.keys(groups);
  for (let i = order.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i+1)); [order[i], order[j]] = [order[j], order[i]]; }
  const out = [], qi = {};
  while (out.length < 10){
    let added = false;
    for (const d of order){
      const g = groups[d], i = qi[d] = (qi[d] || 0);
      if (i < g.length){ out.push(g[i]); qi[d] = i + 1; added = true; }
      if (out.length === 10) break;
    }
    if (!added) break;
  }
  return out;
}

/* ---- 状态 ---- */
const K_READ = 'hltb.roulette.read.v1', K_THEME = 'hltb.roulette.theme.v1';
const state = {
  seed: todayStr(),
  mode: 'all',
  q: '',
  sec: null,
  read: new Set(JSON.parse(localStorage.getItem(K_READ) || '[]')),
  ten: [],
};
const byKey = Object.fromEntries(DB.items.map(i => [i.k, i]));

function esc(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function refCount(src){
  return (String(src).match(/https?:\/\//g) || []).length;
}
function match(it){
  if (state.q){
    const q = state.q.toLowerCase();
    if (!(it.t + ' ' + it.p).toLowerCase().includes(q)) return false;
  }
  if (state.mode === 'a' && !/^A/.test(it.e)) return false;
  return true;
}
function isRead(k){ return state.read.has(k); }
function markRead(k){
  if (state.read.has(k)) return false;
  state.read.add(k);
  localStorage.setItem(K_READ, JSON.stringify([...state.read]));
  return true;
}

/* ---- 每日十条 ---- */
function chipHtml(it){
  return '<span class="dom" data-d="' + it.d + '"><i></i>' + esc(DOM[it.d]) + '</span>' +
    '<span class="grade ' + (/^A/.test(it.e) ? 'A' : /^B/.test(it.e) ? 'B' : 'C') + '">' + esc(it.e[0]) + '</span>' +
    '<span class="sect">§' + it.s + '.' + it.n + '　' + esc(it.st) + '</span>' +
    (isRead(it.k) ? '<span class="readmark">已读</span>' : '');
}
function dcardHtml(it, i){
  return '<li><article class="dcard" tabindex="0" role="button" data-jump="' + it.k + '" data-d="' + it.d + '" aria-label="第 ' + (i+1) + ' 条：' + esc(it.t) + '">' +
    '<div class="dmeta">' + chipHtml(it) + '</div>' +
    '<h3>' + esc(it.t) + '</h3>' +
    '<p class="plain">' + esc(it.p) + '</p>' +
    '<div class="dfoot"><span class="cost" title="' + esc(it.c) + '">' + esc(it.c) + '</span>' +
    '<span class="jump">看全文 ›</span></div>' +
    '</article></li>';
}
function renderDial(items, angle){
  const R = 24, W = 7, r = R - W/2, cx = 32, cy = 32, gap = 4;
  let paths = '';
  items.forEach((it, i) => {
    const a0 = (-90 + i*36 + gap/2) * Math.PI/180, a1 = (-90 + (i+1)*36 - gap/2) * Math.PI/180;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0), x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    paths += '<path d="M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + '" fill="none" stroke="' + dcolor(it.d) + '" stroke-width="' + W + '" stroke-linecap="round"/>';
  });
  const g = document.getElementById('dialArcs');
  g.innerHTML = paths;
  g.style.transform = 'rotate(' + angle + 'deg)';
}
function renderDaily(spin){
  state.ten = pickTen(state.seed);
  const list = state.ten.filter(match);
  const box = document.getElementById('dList');
  box.innerHTML = list.length ? list.map(dcardHtml).join('') : '<li class="tip">没有匹配的条目，换个关键词，或点「全部」。</li>';

  document.getElementById('dDate').textContent = state.seed === todayStr() ? todayStr() : state.seed.slice(5);
  document.getElementById('dLede').textContent = '同一天里刷新多少次都是这十条，第二天自动换新的；十条覆盖八个生活领域。';
  document.getElementById('rail').innerHTML = state.ten.map(it => '<i data-d="' + it.d + '" title="' + esc(DOM[it.d]) + '"></i>').join('');
  const used = [...new Set(state.ten.map(i => i.d))];
  document.getElementById('railLegend').innerHTML = used.map(d =>
    '<span data-d="' + d + '"><b></b>' + esc(DOM[d]) + '</span>').join('');
  const note = document.getElementById('dNote');
  const parts = [];
  parts.push('优先从「不花钱或少花钱 + 收益大」里抽，共 ' + DB.items.length + ' 条候选池');
  if (state.mode === 'a') parts.push('只看 A 级：本批 A 级 ' + state.ten.filter(i => /^A/.test(i.e)).length + ' 条');
  if (state.mode === 'plain') parts.push('只看说人话：已隐去标题和成本，只留原文那一段');
  if (state.q) parts.push('关键词「' + state.q + '」命中 ' + list.length + ' 条');
  parts.push('已读状态只存在你自己的浏览器里，不做打卡。');
  note.textContent = parts.join('；') + '。';
  renderDial(state.ten, spin === undefined ? 0 : spin);
}

/* ---- 正文卡片 ---- */
function icardHtml(it, id){
  const g = /^A/.test(it.e) ? 'A' : /^B/.test(it.e) ? 'B' : 'C';
  const n = refCount(it.src);
  return '<article class="icard" id="' + (id || ('s' + it.k)) + '" data-d="' + it.d + '">' +
    '<div class="dmeta">' + chipHtml(it) + '</div>' +
    '<h3 style="margin:6px 0 0;font-size:17px;line-height:1.6">' + esc(it.t) + '</h3>' +
    '<p class="plain" style="margin-top:8px">' + esc(it.p) + '</p>' +
    '<dl class="kv">' +
      '<dt>成本</dt><dd>' + esc(it.c) + '</dd>' +
      '<dt>收益</dt><dd>' + esc(it.b) + '</dd>' +
      (it.r ? '<dt>备注</dt><dd>' + esc(it.r) + '</dd>' : '') +
    '</dl>' +
    '<details><summary>来源' + (n ? '（' + n + ' 条文献外链）' : '') + '</summary><p class="src">' + esc(it.src) + '</p></details>' +
    '</article>';
}
function renderBody(){
  const slot = document.getElementById('detailSlot');
  const box = document.getElementById('bodyList');
  const sub = document.getElementById('bodySub');
  if (state.sec != null){
    const s = DB.secs.find(x => x.s === state.sec);
    const items = DB.items.filter(i => i.s === state.sec && match(i));
    document.getElementById('bodyTitle').textContent = '§' + s.s + '　' + s.t;
    sub.textContent = '全书共 ' + s.n + ' 条，本次演示载入 ' + items.length + ' 条';
    slot.innerHTML = '';
    box.innerHTML = items.length ? items.map(i => icardHtml(i)).join('')
      : '<p class="tip">这一节在本次演示里没有载入条目（设计稿只载入 61 条样本）。</p>';
  } else {
    document.getElementById('bodyTitle').textContent = '正文 · 目录里的原条目';
    sub.textContent = '点每日十条里的任意一条，这里会展开对应原文';
    box.innerHTML = DEMO.map(k => icardHtml(byKey[k])).filter(Boolean).join('');
  }
}
const DEMO = ['13-3', '5-27', '11-6'];

function openDetail(k){
  const it = byKey[k];
  if (!it) return;
  const slot = document.getElementById('detailSlot');
  slot.innerHTML = '<p class="tip">从「每日十条」第 ' + (state.ten.findIndex(x => x.k === k) + 1) + ' 条跳过来的原文，可点下面标题回到顶部。</p>' + icardHtml(it);
  const fresh = markRead(k);
  renderDaily();
  const el = slot.querySelector('.icard');
  el.classList.add('flash');
  setTimeout(() => el.scrollIntoView({behavior:'smooth', block:'start'}), 10);
  if (fresh) toast('记下了：§' + it.s + '.' + it.n);
}
let toastEl = null, toastTimer = null;
function toast(msg){
  if (!toastEl){
    toastEl = document.createElement('div');
    toastEl.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s';
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  requestAnimationFrame(() => toastEl.style.opacity = '1');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.style.opacity = '0', 1800);
}

/* ---- 目录 ---- */
function renderToc(){
  document.getElementById('tocList').innerHTML = DB.secs.map(s => {
    const loaded = DB.items.filter(i => i.s === s.s).length;
    return '<li data-d="' + s.d + '"' + (loaded ? '' : ' class="empty"') + '>' +
      '<button type="button" data-sec="' + s.s + '" title="本次载入 ' + loaded + ' 条 / 本节共 ' + s.n + ' 条"' + (state.sec === s.s ? ' aria-current="true"' : '') + '>' +
      '<span class="dot"></span><span class="tt">' + esc(s.t) + '</span><span class="nn">' + (loaded ? loaded + '/' : '') + s.n + '</span>' +
      '</button></li>';
  }).join('');
}

/* ---- 主题 ---- */
const SUN = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>';
const MOON = '<path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2z"/>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem(K_THEME, t);
  document.getElementById('themeIcon').innerHTML = t === 'dark' ? SUN : MOON;
  document.getElementById('themeBtn').title = t === 'dark' ? '切到明亮主题' : '切到暗色主题';
  renderDial(state.ten);
}

/* ---- 事件 ---- */
document.getElementById('reroll').addEventListener('click', () => {
  state.seed = String(Date.now());
  renderDaily(Math.round(Math.random() * 360));
  document.getElementById('daily').scrollIntoView({behavior:'smooth', block:'start'});
});
document.getElementById('themeBtn').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  state.mode = b.dataset.mode;
  document.body.classList.toggle('mode-plain', state.mode === 'plain');
  renderDaily(); renderBody();
}));
let qt = null;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(qt);
  qt = setTimeout(() => { state.q = e.target.value.trim(); renderDaily(); renderBody(); }, 140);
});
document.getElementById('tocList').addEventListener('click', e => {
  const b = e.target.closest('button[data-sec]');
  if (!b || b.parentNode.classList.contains('empty')) return;
  state.sec = Number(b.dataset.sec);
  renderToc(); renderBody();
  document.getElementById('bodyTitle').scrollIntoView({behavior:'smooth', block:'start'});
});
document.getElementById('dList').addEventListener('click', e => {
  const c = e.target.closest('[data-jump]');
  if (c) openDetail(c.dataset.jump);
});
document.getElementById('dList').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){
    const c = e.target.closest('[data-jump]');
    if (c){ e.preventDefault(); openDetail(c.dataset.jump); }
  }
});

/* ---- 启动 ---- */
applyTheme(localStorage.getItem(K_THEME) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
document.getElementById('count').textContent = DB.total_secs + ' 节 · ' + DB.total_items + ' 条';
document.getElementById('fPool').textContent = DB.items.length;
renderToc();
renderDaily(0);
renderBody();
</script>
</body>
</html>
